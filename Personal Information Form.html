<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #263238;
            max-width: 720px;
            margin: 40px auto;
            padding: 28px;
            line-height: 1.5;
        }

        h1, h2 {
            color: #2457a6;
        }

        form {
            background: #ffffff;
            padding: 24px;
            margin: 18px 0 28px;
            border: 1px solid #dce4f0;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(30, 55, 90, 0.08);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #c7d2e2;
            border-radius: 6px;
            background: #fff;
            font: inherit;
        }

        input:focus, select:focus {
            outline: 2px solid #9bbcf5;
            border-color: #2457a6;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background: #2457a6;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #173f80;
        }

        hr {
            border: none;
            border-top: 1px solid #d5deea;
            margin: 30px 0;
        }

        @media (max-width: 600px) {
            body {
                margin: 16px auto;
                padding: 16px;
            }

            form {
                padding: 18px;
            }
        }
    </style>

</head>
<body>

    <h1>Personal Information Form</h1>


    <form action="#blank" method="POST">

        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name" required>


        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name" required>


        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>


        <label for="date_of_birth">Date of Birth:</label>
        <input type="date" id="date_of_birth" name="date_of_birth" required>


        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>


        <button type="submit">Submit</button>

    </form>

    <hr>

    <h2>Search Form</h2>

    <form action="#blank" method="GET">

        <label for="search_name">Search Name:</label>
        <input type="text" id="search_name" name="search_name" required>

        <button type="submit">Search</button>

    </form>

</body>
</html>
